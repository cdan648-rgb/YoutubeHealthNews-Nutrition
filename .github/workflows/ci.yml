name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks needs history to scan commits, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: .env.example holds placeholders only
        run: npm run check:env-example

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        # Captured so the bundle-budget check reads Next's own reported figure rather
        # than rebuilding.
        #
        # The Supabase URL and anon key are PUBLIC values (they ship to every browser; RLS
        # protects the data), so they are read from repository *variables*, never secrets.
        # They are optional: when unset, the data layer returns empty results and the build
        # prerenders the DB-backed pages as empty shells that ISR fills at runtime, so CI
        # never hard-depends on a live database. When set, CI builds real content exactly as
        # production does. A service-role key is never needed at build and never belongs here.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        # `set -o pipefail` so a failed build fails the step even though it is piped to tee;
        # otherwise the pipe would report tee's exit code and the bundle-budget step could run
        # against an incomplete log. The budget step therefore only ever sees a successful build.
        run: |
          set -o pipefail
          npm run build | tee build.log

      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs --from-file build.log

      - name: No secrets in build output
        run: npm run check:secrets

  # ---------------------------------------------------------------------------
  # Database tests. Additive: this job cannot weaken the `verify` job above,
  # which still runs on every push with no database at all.
  #
  # The suite needs a Postgres connection. Every test wraps itself in
  # BEGIN ... ROLLBACK, so pointing it at the Supabase project leaves no trace.
  # Set the DATABASE_URL repository secret to enable it; without the secret the
  # job reports the suite inventory and passes, so forks and contributors without
  # database access are not blocked.
  # ---------------------------------------------------------------------------
  database:
    name: Database (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mapped at job level so the `if:` conditions below can read it. A secret is
    # not visible in the `env` context unless it is bound like this.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Suite inventory
        run: npm run test:db:list

      - name: Run pgTAP suite
        if: ${{ env.DATABASE_URL != '' }}
        run: node scripts/run-db-tests.mjs --allow-remote

      - name: Note when skipped
        if: ${{ env.DATABASE_URL == '' }}
        run: echo "DATABASE_URL secret not set - pgTAP execution skipped. Set it to enable."

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so `gitleaks detect` scans every commit, not just the tip.
          fetch-depth: 0

      # `gitleaks detect` scans the WHOLE git history of the checkout. This is a full scan,
      # not a weakened one — it is strictly broader than the push-delta scan the marketplace
      # action performs. It is also robust to a recreated or brand-new branch and to a
      # missing/invalid before-SHA: it never consults the push event's commit range, which
      # was the cause of the "invalid commit range" failure. A non-zero exit (any leak) fails
      # the job. Pinned to a specific release so the check cannot change under us.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full git history for secrets
        run: gitleaks detect --source . --redact --no-banner --verbose --exit-code 1
